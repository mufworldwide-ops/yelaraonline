<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yelara — Slow Fashion Atelier</title>
  
  <!-- Netlify Identity Widget for CMS Login -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #161616;
      --text-main: #f3f3f3;
      --text-muted: #a0a0a0;
      --accent: #d4af37;
      --border-color: #262626;
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-sans); line-height: 1.6; }
    
    header { padding: 2rem; text-align: center; border-bottom: 1px solid var(--border-color); }
    header h1 { font-family: var(--font-serif); font-size: 2.5rem; letter-spacing: 2px; color: var(--accent); }

    .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
    .section-title { font-family: var(--font-serif); font-size: 2rem; margin-bottom: 2rem; text-align: center; }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .product-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      background-color: #222;
    }

    .product-info { padding: 1.25rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-family: var(--font-serif); font-size: 1.4rem; margin-bottom: 0.5rem; }
    .product-price { color: var(--accent); font-weight: 500; font-size: 1.1rem; margin-bottom: 0.75rem; }
    .product-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <h1>YELARA</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem; letter-spacing: 1px;">SLOW FASHION ATELIER</p>
  </header>

  <main class="container">
    <h2 class="section-title">Our Collection</h2>
    <div id="product-grid" class="product-grid">
      <p style="text-align: center; grid-column: 1 / -1; color: var(--text-muted);">Loading products...</p>
    </div>
  </main>

  <!-- Script to Dynamically Fetch Products from GitHub -->
  <script>
    async function fetchProducts() {
      const grid = document.getElementById('product-grid');
      try {
        // Fetch product markdown files from GitHub repository
        const response = await fetch('https://api.github.com/repos/mufworldwide-ops/yelaraonline/contents/products');
        if (!response.ok) throw new Error('No products found');
        
        const files = await response.json();
        grid.innerHTML = ''; // Clear loading text

        for (const file of files) {
          if (file.name.endsWith('.md')) {
            const res = await fetch(file.download_url);
            const text = await res.text();

            // Extract Frontmatter data (Title, Price, Image, Body)
            const titleMatch = text.match(/title:\s*["']?(.*?)["']?\r?\n/);
            const priceMatch = text.match(/price:\s*["']?(.*?)["']?\r?\n/);
            const imageMatch = text.match(/image:\s*["']?(.*?)["']?\r?\n/);
            
            // Clean up description content below YAML header
            const bodyContent = text.replace(/---[\s\S]*?---/, '').trim();

            const title = titleMatch ? titleMatch[1] : 'Untitled Product';
            const price = priceMatch ? priceMatch[1] : '';
            let image = imageMatch ? imageMatch[1] : '';

            // Render Product Card HTML
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
              ${image ? `<img src="${image}" alt="${title}" onerror="this.style.display='none'">` : ''}
              <div class="product-info">
                <div>
                  <h3 class="product-title">${title}</h3>
                  ${price ? `<p class="product-price">${price}</p>` : ''}
                  <p class="product-desc">${bodyContent}</p>
                </div>
              </div>
            `;
            grid.appendChild(card);
          }
        }
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: var(--text-muted);">No products found yet. Add products via Decap CMS!</p>';
      }
    }

    fetchProducts();
  </script>

  <!-- Netlify Identity Redirect Logic -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
